<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - xyz Bakery</title>

    <link rel="stylesheet" href="assets/css/normalize.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/pages/cart.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;700&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="assets/img/logo2.png" type="image/x-icon" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  </head>
  <body>
    <header class="line-after">
      <div class="container-flex header-container">
        <div class="header-identity">
          <img src="assets/img/logo.svg" alt="" class="header-logo" />
          <p class="header-name">xyz Bakery</p>
        </div>
        <nav>
          <div class="links">
            <div class="links-blockcontainer container">
              <ul class="links-container container-flex">
                <img
                  src="assets/img/header/x.svg"
                  alt=""
                  class="links-x"
                  onclick="headerMobileMenu()"
                />
                <li class="links-item container-flex">
                  <img
                    src="assets/img/header/home.svg"
                    alt=""
                    class="links-item-icon"
                  />
                  <a href="index.html" class="links-item-link line-after"
                    >Home</a
                  >
                </li>
                <li class="links-item container-flex">
                  <img
                    src="assets/img/header/about-us.svg"
                    alt=""
                    class="links-item-icon"
                  />
                  <a href="aboutus.html" class="links-item-link line-after"
                    >About Us</a
                  >
                </li>
                <li class="links-item container-flex">
                  <img
                    src="assets/img/header/products-icon.svg"
                    alt=""
                    class="links-item-icon"
                  />
                  <a href="products.html" class="links-item-link line-after"
                    >Products</a
                  >
                </li>
                <li class="links-item container-flex">
                  <img
                    src="assets/img/header/blog.svg"
                    alt=""
                    class="links-item-icon"
                  />
                  <a href="blog.html" class="links-item-link line-after"
                    >Blog</a
                  >
                </li>
                <li class="links-item container-flex">
                  <img
                    src="assets/img/header/contact-us.svg"
                    alt=""
                    class="links-item-icon"
                  />
                  <a href="contactus.html" class="links-item-link line-after"
                    >Contact Us</a
                  >
                </li>
              </ul>
            </div>
          </div>
          <img
            src="assets/img/header/burger.svg"
            alt=""
            onclick="headerMobileMenu()"
            class="header-burger"
          />
        </nav>
      </div>
      <script src="assets/js/mobile-header.js"></script>
    </header>

    <section class="main-cart">
      <div class="container">
        <h1 class="main-cart-title">Your Cart</h1>
        
        <div class="main-cart-container">
          <div class="main-cart-items">
            <div class="cart-empty-message" id="cartEmpty">
              <p>Your cart is empty</p>
              <a href="products.html" class="continue-shopping-btn">Continue Shopping</a>
            </div>
            
            <ul class="cart-items-list" id="cartItemsList">
              <!-- Cart items will be populated by JavaScript -->
            </ul>
          </div>
          
          <div class="main-cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-details">
              <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotalAmount">₹0.00</span>
              </div>
              <div class="summary-row">
                <span>Shipping</span>
                <span id="shippingCost">Free</span>
              </div>
              <div class="summary-row total-row">
                <span>Total</span>
                <span id="totalAmount">₹0.00</span>
              </div>
            </div>
            
            <div class="free-shipping-info">
              <p>Add <span id="shippingThreshold">₹600.00</span> more for FREE shipping</p>
            </div>
            
            <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
            <button class="clear-cart-btn" id="clearCartBtn">Clear Cart</button>
          </div>
        </div>
      </div>
    </section>

    <script src="assets/js/cart.js"></script>
  </body>
</html>
